[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsights-data-scraping"
version = "0.1.0"
description = "Scalable multi-source financial news and stock market scraping engine with Dagster & K3s"
authors = [{ name = "Finsights Team" }]
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.0",
    "dagster-k8s>=0.29.0",
    "httpx[http2]>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "PyYAML>=6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
