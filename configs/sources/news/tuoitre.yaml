source_code: tuoitre_news
publisher_code: tuoitre
name: Tuổi Trẻ - tài chính và chứng khoán
base_url: https://tuoitre.vn
publisher_domain: tuoitre.vn
attribution_name: Tuổi Trẻ Online
timezone: Asia/Ho_Chi_Minh
request_rate_per_second: 0.5
collection_enabled: true
use_scope: personal_academic_research
binary_asset_collection_enabled: false

# Personal thesis research: keep collected records internal and attribute the source.
access:
  use_scope: personal_academic_research
  internal_only: true
  attribution_required: true
  redistribution_allowed: false
  respect_robots_txt: true
rights:
  status: unknown
  binary_asset_statuses: []

article_id_regex: '-(?P<article_id>\d{6,})\.htm$'
discovery:
  mode: rss_only
  html_backfill:
    strategy: sitemap
    sitemap_index_url: https://tuoitre.vn/sitemaps/index.rss
    partition_type: five_day
    max_article_failure_ratio: 0.25
    headline_filter_terms:
      - chứng khoán
      - cổ phiếu
      - VN-Index
      - VN30
      - HOSE
      - HNX
      - UPCoM
      - doanh nghiệp
      - niêm yết
      - báo cáo tài chính
      - cổ tức
      - trái phiếu
      - lãi suất
      - tỷ giá
      - ngân hàng
      - khối ngoại
      - thanh khoản
      - công bố thông tin
      - tài chính
      - kinh tế
      - đầu tư
      - thị trường
      - lợi nhuận
      - doanh thu
      - bảo hiểm
      - quỹ đầu tư
      - IPO
  rss_feeds:
    - url: https://tuoitre.vn/kinh-doanh.rss
      category: business_finance

article:
  title_selectors: ["h1.article-title", "h1"]
  summary_selectors: [".detail__summary", ".detail-summary", "h2.sapo"]
  subtitle_selectors: [".detail__sub-title", ".detail-subtitle"]
  author_selectors: [".author-info", ".detail-author", "[rel='author']"]
  content_selectors: ["#main-detail-body", ".detail__content", ".detail-content"]
  full_text_required: true

financial_relevance:
  terms:
    - chứng khoán
    - cổ phiếu
    - VN-Index
    - VN30
    - HOSE
    - HNX
    - UPCoM
    - doanh nghiệp niêm yết
    - báo cáo tài chính
    - cổ tức
    - trái phiếu
    - lãi suất
    - tỷ giá
    - ngân hàng
    - khối ngoại
    - thanh khoản
    - công bố thông tin
