source_code: vneconomy_news
publisher_code: vneconomy
name: Tạp chí Kinh tế Việt Nam - VnEconomy
base_url: https://vneconomy.vn
publisher_domain: vneconomy.vn
attribution_name: Tạp chí Kinh tế Việt Nam / VnEconomy
timezone: Asia/Ho_Chi_Minh
request_rate_per_second: 0.5
collection_enabled: true
use_scope: licensed_personal_project
binary_asset_collection_enabled: false

access:
  use_scope: licensed_personal_project
  internal_only: false
  attribution_required: true
  redistribution_allowed: true
  respect_robots_txt: true
rights:
  status: licensed_full_text
  binary_asset_statuses: []

article_id_regex: '/(?P<article_id>[^/]+)\.htm$'
discovery:
  mode: html_archive
  max_pages: 2000
  link_selectors: ["article a[href$='.htm']"]
  archive_categories:
    - code: securities
      first_page: https://vneconomy.vn/chung-khoan.htm
      page_template: https://vneconomy.vn/chung-khoan.htm?page={page}
  html_backfill:
    strategy: sitemap
    sitemap_index_url: https://vneconomy.vn/sitemap.xml
    partition_type: monthly
    max_article_failure_ratio: 0.25

article:
  title_selectors: [".article-header__title", "h1[data-field='title']"]
  summary_selectors: [".article-content__lead", "[data-field='sapo']"]
  author_selectors: [".article-meta__name", "[data-field='author']"]
  content_selectors: ["#article-editor", "main.article-editor"]
  full_text_required: true

financial_relevance:
  terms:
    - chứng khoán
    - cổ phiếu
    - VN-Index
    - VN30
    - HOSE
    - HNX
    - UPCoM
    - doanh nghiệp niêm yết
    - báo cáo tài chính
    - cổ tức
    - trái phiếu
    - lãi suất
    - tỷ giá
    - ngân hàng
    - khối ngoại
    - thanh khoản
    - công bố thông tin
    - thị trường
    - tài chính
    - vàng
    - giá dầu
    - giá xăng
    - bất động sản
    - lạm phát
    - tín dụng
    - USD
    - ngoại hối
    - Fed
