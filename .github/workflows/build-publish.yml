name: Build & Publish Scraping Image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: finsights-data-scraping-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Scraping Engine Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=finsights-scraping
          cache-to: type=gha,mode=max,scope=finsights-scraping

      - name: Trigger K3s Dagster Code Server Rollout Restart
        if: success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '103.249.117.232' }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || '26567' }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "🚀 Triggering automatic rollout restart of Dagster code server on K3s..."
            mkdir -p ~/.ssh
            echo "${SSH_PRIVATE_KEY}" > ~/.ssh/finsights_vps
            chmod 600 ~/.ssh/finsights_vps
            ssh -i ~/.ssh/finsights_vps -o StrictHostKeyChecking=no -p "${VPS_PORT}" "root@${VPS_HOST}" \
              "kubectl rollout restart deployment dagster-dagster-user-deployments-finsights-data-scraping -n orchestration"
            echo "✅ Rollout restart triggered successfully!"
          else
            echo "ℹ️ SSH_PRIVATE_KEY not configured in GitHub Secrets; skipping automatic rollout restart."
          fi

